name: Build Be Hoc Vui Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository root
        run: |
          echo "Repository root:"
          pwd
          ls -la
          test -f package.json || (echo "ERROR: package.json must be in the repository root" && exit 1)
          test -f capacitor.config.json || (echo "ERROR: capacitor.config.json must be in the repository root" && exit 1)
          test -f www/index.html || (echo "ERROR: www/index.html is missing" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Intentionally no Gradle cache: the Android project may not exist yet.

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Be-Hoc-Vui-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
